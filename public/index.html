<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .controls {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        select, input, button {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 12px 24px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .app-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .app-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .currency-section {
            margin-bottom: 20px;
        }

        .currency-section:last-child {
            margin-bottom: 0;
        }

        .currency-header {
            font-weight: 600;
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .stat-value.positive {
            color: #10b981;
        }

        .stat-value.negative {
            color: #ef4444;
        }

        .stat-value.fee {
            color: #f59e0b;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }

        .sync-status {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .sync-status.syncing {
            border-left-color: #f59e0b;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #e0e7ff;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Stripe Analytics Dashboard</h1>
            <p>基于 metadata 的收支统计分析</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="appFilter">应用筛选</label>
                <select id="appFilter">
                    <option value="">所有应用</option>
                </select>
            </div>

            <div class="control-group">
                <label for="startDate">开始日期</label>
                <input type="date" id="startDate">
            </div>

            <div class="control-group">
                <label for="endDate">结束日期</label>
                <input type="date" id="endDate">
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="loadStats()">🔍 查询</button>
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="syncData()" id="syncBtn">🔄 同步数据</button>
            </div>
        </div>

        <div id="syncStatus"></div>
        <div id="errorMessage"></div>
        <div id="loading" class="loading" style="display: none;">加载中...</div>
        <div id="statsContainer" class="stats-grid"></div>
    </div>

    <script>
        let apps = [];

        // 页面加载时初始化
        async function init() {
            await loadApps();
            await loadStats();
        }

        // 加载应用列表
        async function loadApps() {
            try {
                const response = await fetch('/api/apps');
                const result = await response.json();

                if (result.success) {
                    apps = result.data;
                    const select = document.getElementById('appFilter');

                    apps.forEach(appId => {
                        const option = document.createElement('option');
                        option.value = appId;
                        option.textContent = appId;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading apps:', error);
            }
        }

        // 加载统计数据
        async function loadStats() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('statsContainer');
            const errorMessage = document.getElementById('errorMessage');

            loading.style.display = 'block';
            container.innerHTML = '';
            errorMessage.innerHTML = '';

            try {
                const appId = document.getElementById('appFilter').value;
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;

                const params = new URLSearchParams();
                if (appId) params.append('app_id', appId);
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);

                const response = await fetch(`/api/stats/summary?${params}`);
                const result = await response.json();

                loading.style.display = 'none';

                if (result.success) {
                    displayStats(result.data);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                loading.style.display = 'none';
                errorMessage.innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
            }
        }

        // 显示统计数据
        function displayStats(data) {
            const container = document.getElementById('statsContainer');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>📊 暂无数据</h3>
                        <p>请先点击"同步数据"按钮从 Stripe 拉取交易数据</p>
                        <button onclick="syncData()">🔄 立即同步</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map(app => `
                <div class="app-card">
                    <h2>
                        ${app.app_id}
                        <span class="badge">${app.currencies.length} 货币</span>
                    </h2>
                    ${app.currencies.map(currency => `
                        <div class="currency-section">
                            <div class="currency-header">
                                💰 ${currency.currency}
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">总收入</span>
                                <span class="stat-value positive">${currency.currency} ${currency.revenue}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">手续费</span>
                                <span class="stat-value fee">-${currency.currency} ${currency.fee}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">退款</span>
                                <span class="stat-value negative">-${currency.currency} ${currency.refunds}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label"><strong>净收入</strong></span>
                                <span class="stat-value positive"><strong>${currency.currency} ${currency.net}</strong></span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">交易数量</span>
                                <span class="stat-value">${currency.transaction_count}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">退款数量</span>
                                <span class="stat-value">${currency.refund_count}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        // 同步数据
        async function syncData() {
            const btn = document.getElementById('syncBtn');
            const syncStatus = document.getElementById('syncStatus');

            btn.disabled = true;
            btn.textContent = '⏳ 同步中...';

            syncStatus.innerHTML = `
                <div class="sync-status syncing">
                    🔄 正在从 Stripe 同步数据，请稍候...（这可能需要几分钟时间）
                </div>
            `;

            try {
                const response = await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    syncStatus.innerHTML = `
                        <div class="sync-status">
                            ✅ ${result.message}
                        </div>
                    `;

                    // 等待几秒后重新加载数据
                    setTimeout(() => {
                        loadStats();
                    }, 3000);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                syncStatus.innerHTML = `
                    <div class="sync-status" style="border-left-color: #ef4444;">
                        ❌ 同步失败: ${error.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 同步数据';
            }
        }

        // 初始化
        init();
    </script>
</body>
</html>
